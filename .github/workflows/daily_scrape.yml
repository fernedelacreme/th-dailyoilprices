name: Daily EPPO Scraper

on:
  schedule:
    # 02:17 UTC = 09:17 น. เวลาไทย (เลี่ยงคิวต้นชั่วโมง)
    - cron: '33 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Scraper
        env:
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
        run: python scraper.py

      - name: Commit and Push Updated Parquet
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.parquet
          git diff --staged --quiet || (git commit -m "Auto-update prices $(date +'%Y-%m-%d')" && git push)

      # ------------------ สั่งทักหน้าเว็บ Streamlit เพื่อไม่ให้หลับ ------------------
      - name: Keep Streamlit App Awake
        run: |
          curl -I -s https://th-dailyoilprices.streamlit.app || true
