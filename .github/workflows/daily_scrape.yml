name: Daily EPPO Scraper

on:
  schedule:
    - cron: '0 2 * * *'  # 09:00 น. เวลาไทยทุกวัน
  workflow_dispatch:      # ปุ่มกดรันเองบนเว็บ

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Scraper
        run: |
          cd EPPO_OilPriceTracker
          python scraper.py

      - name: Commit and Push Updated Excel
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add EPPO_Historical_Prices_Merged.xlsx
          git diff --staged --quiet || (git commit -m "Auto-update prices $(date +'%Y-%m-%d')" && git push)
