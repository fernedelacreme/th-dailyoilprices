name: Daily EPPO Scraper

on:
  schedule:
    # 02:17 UTC = 09:17 น. เวลาไทย (เลี่ยงคิวต้นชั่วโมง)
    - cron: '11 11 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # --- ลบ หรือใส่เครื่องหมาย # ปิดขั้นตอน setup-python ทิ้งไปเลย ---
      # - name: Set up Python
      #   uses: actions/setup-python@v5
      #   with:
      #     python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pandas requests beautifulsoup4 pyarrow openpyxl

      - name: Run scraper
        run: python scraper.py

      - name: Commit and push changes
        shell: pwsh
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.parquet
          
          # เช็กว่ามีการเปลี่ยนแปลงไฟล์ไหม ก่อนจะ commit
          $status = git status --porcelain
          if ($status) {
              $dateStr = Get-Date -Format "yyyy-MM-dd"
              git commit -m "Auto-update prices $dateStr"
              git push
          } else {
              Write-Host "No changes to commit."
          }

      # ------------------ สั่งทักหน้าเว็บ Streamlit เพื่อไม่ให้หลับ ------------------
      - name: Keep Streamlit App Awake
        run: |
          curl -I -s https://th-dailyoilprices.streamlit.app || true
